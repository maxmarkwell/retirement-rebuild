name: AG production diagnostic validation
on:
  pull_request:
    paths:
      - 'app/api/accelerated-growth/production-diagnostic/**'
      - 'tests/ag-production-diagnostic/**'
      - '.github/workflows/ag-production-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit --incremental false
      - run: node tests/ag-production-diagnostic/check.cjs
