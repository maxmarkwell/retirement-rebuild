name: AG authorized stage continuation
on:
  pull_request:
    paths:
      - 'lib/discovery/accelerated-growth/authorized-stage-continuation.ts'
      - 'tests/ag-authorized-stage/**'
      - '.github/workflows/ag-authorized-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit --incremental false
      - run: node tests/ag-authorized-stage/check.cjs
