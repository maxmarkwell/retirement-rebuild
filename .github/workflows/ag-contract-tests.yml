name: AG contract tests
on:
  push:
    branches: [fix/ag-stale-cycle-diagnostics]
  workflow_dispatch:
jobs:
  ag-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:ag
      - run: npx next typegen
      - run: npx tsc --noEmit
