name: Read-only contribution review guard
on:
  pull_request:
    paths:
      - 'components/shared-contribution-preview.tsx'
      - '.github/workflows/shared-contribution-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit --incremental false
      - name: Assert contribution preview remains local-only
        run: node tests/shared-contribution-review/check.cjs
