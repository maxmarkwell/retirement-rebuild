name: AG live annual research signal batch validation
on:
  pull_request:
    paths:
      - 'lib/discovery/accelerated-growth/live-financial-signal-batch.ts'
      - 'app/api/accelerated-growth/live-financial-signal-batch/**'
      - 'tests/ag-live-financial-signal-batch/**'
      - '.github/workflows/ag-live-financial-signal-batch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit --incremental false
      - run: node tests/ag-live-financial-signal-batch/check.cjs
