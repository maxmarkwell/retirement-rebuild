name: AG breadth-first market universe intake
on:
  pull_request:
    paths:
      - 'lib/discovery/accelerated-growth/universe-intake.ts'
      - 'app/api/accelerated-growth/universe-intake/**'
      - 'tests/ag-universe-intake/**'
      - '.github/workflows/ag-universe-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit --incremental false
      - run: node tests/ag-universe-intake/check.cjs
