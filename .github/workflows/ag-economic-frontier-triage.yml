name: AG charter economic opportunity triage
on:
  pull_request:
    paths:
      - 'lib/discovery/accelerated-growth/economic-frontier-triage.ts'
      - 'tests/ag-economic-frontier-triage/**'
      - '.github/workflows/ag-economic-frontier-triage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit --incremental false
      - run: node tests/ag-economic-frontier-triage/check.cjs
