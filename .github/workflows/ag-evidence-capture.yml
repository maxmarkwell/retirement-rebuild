name: AG real evidence capture validation
on:
  pull_request:
    paths:
      - 'app/api/accelerated-growth/evidence-capture/**'
      - 'lib/discovery/accelerated-growth/evidence-capture.ts'
      - 'supabase/migrations/20261104090000_ag_evidence_capture_active_uniqueness.sql'
      - 'tests/ag-evidence-capture/**'
      - '.github/workflows/ag-evidence-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit --incremental false
      - run: node tests/ag-evidence-capture/check.cjs
