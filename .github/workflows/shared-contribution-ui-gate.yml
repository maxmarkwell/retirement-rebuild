name: Shared contribution UI dual-gate validation
on:
  pull_request:
    paths:
      - 'components/shared-contribution-preview.tsx'
      - 'app/page.tsx'
      - '.github/workflows/shared-contribution-ui-gate.yml'
      - 'tests/shared-contribution-ui-gate/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SHARED_CONTRIBUTION_POSTING_ENABLED: 'false'
      SHARED_CONTRIBUTION_UI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit --incremental false
      - run: node tests/shared-contribution-ui-gate/check.cjs
