name: AG charter economics kernel validation
on:
  pull_request:
    paths:
      - 'lib/discovery/accelerated-growth/economics-kernel.ts'
      - 'tests/ag-economics-kernel/**'
      - '.github/workflows/ag-economics-kernel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit --incremental false
      - run: node tests/ag-economics-kernel/check.cjs
