name: AG historical SEC capital baseline
on:
  pull_request:
    paths:
      - 'lib/discovery/accelerated-growth/historical-capital-baseline.ts'
      - 'tests/ag-historical-capital-baseline/**'
      - '.github/workflows/ag-historical-capital-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit --incremental false
      - run: node tests/ag-historical-capital-baseline/check.cjs
