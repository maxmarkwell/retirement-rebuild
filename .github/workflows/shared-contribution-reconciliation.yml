name: Shared contribution reconciliation safety
on:
  pull_request:
    paths:
      - 'app/api/shared-capital/contributions/status/**'
      - 'components/shared-contribution-preview.tsx'
      - 'tests/shared-contribution-reconciliation/**'
      - '.github/workflows/shared-contribution-reconciliation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit --incremental false
      - run: node tests/shared-contribution-reconciliation/check.cjs
