name: AG resumable discovery checkpoint
on:
  pull_request:
    paths:
      - 'lib/discovery/accelerated-growth/resumable-discovery.ts'
      - 'tests/ag-resumable-discovery/**'
      - '.github/workflows/ag-resumable-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit --incremental false
      - run: node tests/ag-resumable-discovery/check.cjs
