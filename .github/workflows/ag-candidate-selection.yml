name: AG candidate selection validation
on:
  pull_request:
    paths:
      - 'lib/discovery/accelerated-growth/candidate-selection.ts'
      - 'lib/discovery/accelerated-growth/discovery.ts'
      - 'lib/discovery/accelerated-growth/deep-research-pipeline.ts'
      - 'tests/ag-candidate-selection/**'
      - '.github/workflows/ag-candidate-selection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit --incremental false
      - run: node tests/ag-candidate-selection/check.cjs
