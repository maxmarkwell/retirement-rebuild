name: AG pre-revenue evidence safety validation
on:
  pull_request:
    paths:
      - 'lib/discovery/accelerated-growth/live-financial-signal-batch.ts'
      - 'lib/discovery/accelerated-growth/financial-inflection-signals.ts'
      - 'tests/ag-pre-revenue-evidence/**'
      - '.github/workflows/ag-pre-revenue-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit --incremental false
      - run: node tests/ag-financial-inflection-signals/check.cjs
      - run: node tests/ag-live-financial-signal-batch/check.cjs
      - run: node tests/ag-pre-revenue-evidence/check.cjs
